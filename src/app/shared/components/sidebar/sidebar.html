<aside class="sidebar">
  <a class="sidebar__brand" routerLink="/overview" aria-label="NEXUS_OPS home">
    <span class="sidebar__logo"><i class="bi bi-cpu-fill"></i></span>
    <span class="sidebar__label sidebar__title">NEXUS<em>_OPS</em></span>
  </a>

  <nav class="sidebar__nav" aria-label="Main navigation">
    <span class="sidebar__label sidebar__section">Menu</span>
    @for (item of navItems; track item.route) {
      <a
        class="sidebar__link"
        [routerLink]="item.route"
        routerLinkActive="is-active"
        [title]="item.label"
      >
        <i class="bi" [class]="item.icon"></i>
        <span class="sidebar__label">{{ item.label }}</span>
      </a>
    }
  </nav>
